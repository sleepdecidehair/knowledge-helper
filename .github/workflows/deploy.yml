name: Build & Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署目标'
        required: true
        type: choice
        options: [test, production]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/sleepdecidehair/knowledge-helper-backend
  IMAGE_FRONTEND: ghcr.io/sleepdecidehair/knowledge-helper-frontend

jobs:
  # ---------- CI: 测试 ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  # ---------- 构建镜像 ----------
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker tag
        id: tag
        run: |
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "tag=${BRANCH}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_BACKEND }}:${{ github.ref_name }}
          # cache disabled - gha cache requires docker buildx driver

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_FRONTEND }}:${{ github.ref_name }}
          # cache disabled - gha cache requires docker buildx driver

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

  # ---------- 部署到测试环境 (dev 分支自动) ----------
  deploy-test:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: knowledge-helper-test-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to test VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_DIR=/opt/knowledge-helper-private
            DEPLOY_SHA="${{ github.sha }}"
            IMAGE_TAG="${{ needs.build.outputs.tag }}"

            cd "$DEPLOY_DIR"
            git config --global --add safe.directory "$DEPLOY_DIR"
            install -d -m 700 "$HOME/.ssh"
            GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15" \
              git fetch --depth=1 origin "$DEPLOY_SHA"
            git checkout --detach --force "${DEPLOY_SHA}"
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            else
              printf '\nIMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env
            fi
            docker compose -f docker-compose.yml -f docker-compose.test.yml -p kh-test pull
            docker compose -f docker-compose.yml -f docker-compose.test.yml -p kh-test up -d --wait --remove-orphans

            HTTPS_PORT="$(sed -n 's/^HTTPS_PORT=//p' .env | tail -1)"
            HTTPS_PORT="${HTTPS_PORT:-8443}"
            curl -kfsS --retry 10 --retry-all-errors --retry-delay 2 \
              "https://127.0.0.1:${HTTPS_PORT}/api/status" >/dev/null

            cleanup_repository() {
              repository="$1"
              current_image="$2"
              docker image ls --format '{{.Repository}}:{{.Tag}}' "$repository" |
                while IFS= read -r image; do
                  [ -n "$image" ] || continue
                  [ "$image" = "$current_image" ] && continue
                  docker image rm "$image" >/dev/null 2>&1 || true
                done
            }
            cleanup_repository "ghcr.io/sleepdecidehair/knowledge-helper-backend" \
              "ghcr.io/sleepdecidehair/knowledge-helper-backend:${IMAGE_TAG}"
            cleanup_repository "ghcr.io/sleepdecidehair/knowledge-helper-frontend" \
              "ghcr.io/sleepdecidehair/knowledge-helper-frontend:${IMAGE_TAG}"

  # ---------- 部署到生产环境 (main 分支, 需审批) ----------
  deploy-production:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/knowledge-helper
            git fetch origin main && git checkout main && git pull origin main
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ needs.build.outputs.tag }}/" .env
            docker compose -p kh-prod pull
            docker compose -p kh-prod up -d --wait --remove-orphans
            docker image prune -f
            docker container prune -f
