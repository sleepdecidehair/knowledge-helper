name: Build & Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署目标'
        required: true
        type: choice
        options: [test, production]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/sleepdecidehair/knowledge-helper-backend
  IMAGE_FRONTEND: ghcr.io/sleepdecidehair/knowledge-helper-frontend

jobs:
  # ---------- CI: 测试 ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a57c233f1394a9cdc5e5ea4234ac263c31cb083f # v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  # ---------- 构建镜像 ----------
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 先构建前端 (产物被后端 Dockerfile 引用)
      - uses: actions/setup-node@9e1384f558b0cf660fc2d9344aef8e33c98c33a1 # v4.5.1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780dcfcb9fd9c5d40e9cab38aa2b506d4c0b0b7 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker tag
        id: tag
        run: |
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "tag=${BRANCH}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@471ffb12fb4d19eac29b2dd848f89732830bf688 # v6.16.0
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_BACKEND }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@471ffb12fb4d19eac29b2dd848f89732830bf688 # v6.16.0
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_FRONTEND }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

  # ---------- 部署到测试环境 (dev 分支自动) ----------
  deploy-test:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy to test VPS
        uses: appleboy/ssh-action@21f8edc3426338b67bee007ba2aa89482d819ec8 # v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/knowledge-helper
            echo "IMAGE_TAG=${{ needs.build.outputs.tag }}" > .env
            docker compose -f docker-compose.yml -f docker-compose.test.yml -p kh-test pull
            docker compose -f docker-compose.yml -f docker-compose.test.yml -p kh-test up -d --wait
            docker image prune -af --filter "until=24h"

  # ---------- 部署到生产环境 (main 分支, 需审批) ----------
  deploy-production:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      # 在 GitHub Settings → Environments → production 中配置审批者
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy to production VPS
        uses: appleboy/ssh-action@21f8edc3426338b67bee007ba2aa89482d819ec8 # v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/knowledge-helper
            echo "IMAGE_TAG=${{ needs.build.outputs.tag }}" > .env
            docker compose -p kh-prod pull
            docker compose -p kh-prod up -d --wait
            docker image prune -af --filter "until=48h"
