# --- Knowledge Helper 生产环境 Docker Compose ---
# 在 VPS 上运行: docker compose -p kh-prod up -d

services:
  backend:
    image: ghcr.io/sleepdecidehair/knowledge-helper-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_ANTHROPIC_BASE_URL=${DEEPSEEK_ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - AGENT_TOOL_BASE_URL=${AGENT_TOOL_BASE_URL:-http://backend:8000}
      - AGENT_MAX_TURNS=${AGENT_MAX_TURNS:-6}
      - AGENT_CONTEXT_COMPACTION_TOKENS=${AGENT_CONTEXT_COMPACTION_TOKENS:-60000}
      - AGENT_TIMEOUT_SECONDS=${AGENT_TIMEOUT_SECONDS:-90}
      - TOP_K=${TOP_K:-5}
      - CHUNK_SIZE=${CHUNK_SIZE:-900}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-120}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-15}
      # S3 配置 (可选)
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-knowledge}
    volumes:
      - app_data:/app/data
      - ./knowledge:/app/knowledge:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/sleepdecidehair/knowledge-helper-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  app_data:
